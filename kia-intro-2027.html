<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>2027년의 나는 어디로 움직일까요?</title>


<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
html,body{margin:0;padding:0;background:#07090D;}
a{color:#EAF6FF;text-decoration:none;}
a:hover{color:#9FE7FF;}
@keyframes om-rise{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes om-fade{from{opacity:0;}to{opacity:1;}}
@keyframes om-mask{from{clip-path:inset(0 0 100% 0);transform:translateY(18px);}to{clip-path:inset(0 0 -20% 0);transform:translateY(0);}}
@keyframes om-line{from{transform:scaleX(0);opacity:0;}60%{opacity:1;}to{transform:scaleX(1);opacity:1;}}
@keyframes om-streak{0%{left:-22%;opacity:0;}12%{opacity:1;}70%{opacity:1;}100%{left:112%;opacity:0;}}
@keyframes om-glowpulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(1);}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.12);}}
@keyframes om-dot{0%,100%{opacity:.28;}50%{opacity:1;}}
@keyframes om-drift{0%{transform:translate3d(0,0,0);}100%{transform:translate3d(-60px,-40px,0);}}
@keyframes om-blink{0%,45%{opacity:1;}50%,95%{opacity:.15;}100%{opacity:1;}}
@keyframes om-arrow{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}
@keyframes om-char{0%{opacity:0;transform:translateY(.85em) scaleY(1.18);filter:blur(14px);}55%{opacity:1;filter:blur(0);}70%{transform:translateY(-.045em) scaleY(.985);}100%{opacity:1;transform:translateY(0) scaleY(1);filter:blur(0);}}
@keyframes om-sweep{0%,62%{transform:translateX(-120%) skewX(-14deg);opacity:0;}66%{opacity:1;}72%{opacity:1;}100%{transform:translateX(120%) skewX(-14deg);opacity:0;}}
@keyframes om-track{from{letter-spacing:.9em;opacity:0;filter:blur(6px);}to{letter-spacing:.34em;opacity:1;filter:blur(0);}}
@keyframes om-breathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-.055em);}}
@keyframes om-run320{from{background-position:0 0;}to{background-position:-320px 0;}}
@keyframes om-run420{from{background-position:0 0;}to{background-position:-420px 0;}}
@keyframes om-run260{from{background-position:0 0;}to{background-position:-260px 0;}}
@keyframes om-run180{from{background-position:0 0;}to{background-position:-180px 0;}}
@keyframes om-raster{0%{background-position:0 0;}100%{background-position:0 4px;}}
@keyframes om-flicker{0%,100%{opacity:1;}37%{opacity:.88;}52%{opacity:.58;}78%{opacity:.8;}}
@keyframes om-jolt{0%,100%{transform:translateY(0);}23%{transform:translateY(1.5px);}47%{transform:translateY(-1px);}71%{transform:translateY(2px);}}

.cta:hover{background:#9FE7FF !important;color:#07090D !important;transform:translateY(-2px);box-shadow:0 18px 44px rgba(159,231,255,.22);}

</head>
<body>


<div style="position:relative;height:100dvh;min-height:520px;width:100%;background:#07090D;color:#F5F1EA;font-family:Pretendard,-apple-system,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;">

  <div style="position:absolute;left:50%;top:58%;width:120vw;height:70vh;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(159,231,255,.16),rgba(159,231,255,0) 72%);pointer-events:none;animation:om-glowpulse 9s ease-in-out infinite;"></div>
  <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;display:flex;flex-direction:column;animation:om-flicker 9s ease-in-out infinite,om-jolt 1.4s steps(4,end) infinite;-webkit-mask-image:radial-gradient(120% 96% at 50% 52%,rgba(0,0,0,.22) 0%,rgba(0,0,0,.55) 44%,#000 100%);mask-image:radial-gradient(120% 96% at 50% 52%,rgba(0,0,0,.22) 0%,rgba(0,0,0,.55) 44%,#000 100%);">

    <div style="flex:0 0 6%;opacity:.8;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 8px,transparent 8px 40px,#EAF6FF 40px 72px,transparent 72px 96px,#EAF6FF 96px 104px,transparent 104px 160px,#EAF6FF 160px 196px,transparent 196px 236px,#EAF6FF 236px 244px,transparent 244px 260px);animation:om-run260 7.5s linear infinite;will-change:background-position;"></div>

    <div style="flex:0 0 6%;opacity:.7;background-image:repeating-linear-gradient(90deg,#9FE7FF 0 8px,transparent 8px 40px,#9FE7FF 40px 72px,transparent 72px 96px,#9FE7FF 96px 104px,transparent 104px 160px,#9FE7FF 160px 196px,transparent 196px 236px,#9FE7FF 236px 244px,transparent 244px 260px);animation:om-run260 3s linear infinite;will-change:background-position;"></div>
    <div style="flex:0 0 8%;opacity:.85;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 40px,transparent 40px 96px,#EAF6FF 96px 104px,transparent 104px 180px,#EAF6FF 180px 232px,transparent 232px 268px,#EAF6FF 268px 276px,transparent 276px 352px,#EAF6FF 352px 400px,transparent 400px 420px);animation:om-run420 3.6s linear infinite;will-change:background-position;"></div>
    <div style="flex:0 0 5%;opacity:1;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 24px,transparent 24px 56px,#EAF6FF 56px 64px,transparent 64px 100px,#EAF6FF 100px 140px,transparent 140px 180px);animation:om-run180 1.5s linear infinite;will-change:background-position;"></div>
    <div style="flex:0 0 10%;opacity:.94;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 14px,transparent 14px 52px,#EAF6FF 52px 60px,transparent 60px 118px,#EAF6FF 118px 166px,transparent 166px 196px,#EAF6FF 196px 204px,transparent 204px 262px,#EAF6FF 262px 300px,transparent 300px 320px);animation:om-run320 2.3s linear infinite;will-change:background-position;"></div>
    <div style="flex:0 0 6%;opacity:.97;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 8px,transparent 8px 40px,#EAF6FF 40px 72px,transparent 72px 96px,#EAF6FF 96px 104px,transparent 104px 160px,#EAF6FF 160px 196px,transparent 196px 236px,#EAF6FF 236px 244px,transparent 244px 260px);animation:om-run260 1.5s linear infinite;will-change:background-position;"></div>
    <div style="flex:0 0 9%;opacity:1;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 40px,transparent 40px 96px,#EAF6FF 96px 104px,transparent 104px 180px,#EAF6FF 180px 232px,transparent 232px 268px,#EAF6FF 268px 276px,transparent 276px 352px,#EAF6FF 352px 400px,transparent 400px 420px);animation:om-run420 1.8s linear infinite;will-change:background-position;"></div>
    <div style="flex:0 0 5%;opacity:1;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 24px,transparent 24px 56px,#EAF6FF 56px 64px,transparent 64px 100px,#EAF6FF 100px 140px,transparent 140px 180px);animation:om-run180 .75s linear infinite;will-change:background-position;"></div>
    <div style="flex:0 0 10%;opacity:1;background-image:repeating-linear-gradient(90deg,#EAF6FF 0 14px,transparent 14px 52px,#EAF6FF 52px 60px,transparent 60px 118px,#EAF6FF 118px 166px,transparent 166px 196px,#EAF6FF 196px 204px,transparent 204px 262px,#EAF6FF 262px 300px,transparent 300px 320px);animation:om-run320 1.05s linear infinite;will-change:background-position;"></div>
    <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(180deg,rgba(7,9,13,.4) 0 2px,rgba(7,9,13,0) 2px 4px);animation:om-raster 2.4s linear infinite;"></div>
  </div>
  <div style="position:absolute;inset:-10%;opacity:.05;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .6px);background-size:3px 3px;animation:om-drift 14s linear infinite alternate;"></div>

        <span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) .70s both;">2</span><span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) .75s both;">0</span><span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) .80s both;">2</span><span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) .85s both;">7</span><span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) .92s both;">년</span><span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) .98s both;">의</span><span style="display:inline-block;width:.28em;"></span><span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.08s both;">나</span><span style="display:inline-block;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.14s both;">는</span>
      </span>
      <span style="display:block;overflow:hidden;padding-bottom:.06em;">
        <span style="display:inline-block;color:#EAF6FF;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.34s both;">어</span><span style="display:inline-block;color:#EAF6FF;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.40s both;">디</span><span style="display:inline-block;color:#EAF6FF;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.46s both;">로</span><span style="display:inline-block;width:.28em;"></span><span style="display:inline-block;background:linear-gradient(92deg,#EAF6FF 12%,#9FE7FF 96%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.56s both,om-breathe 5.5s ease-in-out 3s infinite;">움</span><span style="display:inline-block;background:linear-gradient(92deg,#EAF6FF 12%,#9FE7FF 96%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.63s both,om-breathe 5.5s ease-in-out 3.12s infinite;">직</span><span style="display:inline-block;background:linear-gradient(92deg,#EAF6FF 12%,#9FE7FF 96%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.70s both,om-breathe 5.5s ease-in-out 3.24s infinite;">일</span><span style="display:inline-block;background:linear-gradient(92deg,#EAF6FF 12%,#9FE7FF 96%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.77s both,om-breathe 5.5s ease-in-out 3.36s infinite;">까</span><span style="display:inline-block;background:linear-gradient(92deg,#EAF6FF 12%,#9FE7FF 96%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.84s both,om-breathe 5.5s ease-in-out 3.48s infinite;">요</span><span style="display:inline-block;background:linear-gradient(92deg,#EAF6FF 12%,#9FE7FF 96%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:om-char 1.05s cubic-bezier(.19,1,.28,1) 1.91s both,om-breathe 5.5s ease-in-out 3.6s infinite;">?</span>
      </span>
      <span style="position:absolute;inset:-6% -12%;pointer-events:none;mix-blend-mode:screen;overflow:hidden;">
        <span style="position:absolute;top:0;bottom:0;width:26%;background:linear-gradient(90deg,rgba(159,231,255,0),rgba(159,231,255,.20),rgba(255,255,255,.30),rgba(159,231,255,0));filter:blur(10px);opacity:0;animation:om-sweep 9s cubic-bezier(.5,0,.25,1) 2.2s infinite both;"></span>
      </span>
    </h1>

    <div style="position:relative;height:1px;margin:clamp(28px,4.4vw,52px) 0 clamp(24px,3.4vw,38px);background:linear-gradient(90deg,rgba(245,241,234,.32),rgba(245,241,234,.06));transform-origin:left center;animation:om-line 1.5s cubic-bezier(.16,1,.3,1) 1.9s both;">
      <span style="position:absolute;top:-1px;width:22%;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(159,231,255,0),#9FE7FF,rgba(159,231,255,0));filter:blur(.4px);animation:om-streak 5.2s cubic-bezier(.5,0,.3,1) 2.6s infinite;"></span>
    </div>

    <p style="margin:0;max-width:30ch;font-size:clamp(15px,1.9vw,22px);line-height:1.75;color:rgba(245,241,234,.66);text-wrap:pretty;animation:om-rise 1s cubic-bezier(.16,1,.3,1) 2.2s both;">

    </p>

    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:clamp(16px,2.4vw,28px);margin-top:clamp(30px,4.6vw,52px);animation:om-rise 1s cubic-bezier(.16,1,.3,1) 2.6s both;">
      <a href="https://callmeeddiepark.github.io/kia/" style="display:inline-flex;align-items:center;gap:14px;padding:18px clamp(26px,3vw,36px);border-radius:999px;background:#F5F1EA;color:#07090D;font-size:clamp(15px,1.5vw,17px);font-weight:700;letter-spacing:-.01em;transition:background .25s ease,transform .25s ease,box-shadow .25s ease;box-shadow:0 0 0 rgba(159,231,255,0);" class="cta">
